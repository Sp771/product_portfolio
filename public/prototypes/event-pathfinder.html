<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pathfinder – VetSummit West 2027 mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --side:#f6f7f9; --text:#33383b; --muted:#6c7378; --title:#0b5d73;
  --btn:#0b5a6e; --btn-text:#ffffff; --active:#2f7187; --pill:#e6e7e8; --pill-text:#5b5f62;
  --line:#e2e5e8; --card:#ffffff; --shadow:0 1px 3px rgba(20,30,40,.14);
  --info:#e3f3fa; --info-line:#bfe2f0; --stretch:#fbf2df; --stretch-text:#8a5a06;
  --ai:#eef6f8; --disabled:#e1e1e1; --disabled-text:#9a9a9a; --field:#ffffff;
  --sel:#e1eff3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#161a1c; --side:#1d2225; --text:#e4e7e9; --muted:#a0a8ad; --title:#6cc2d8;
    --btn:#2c8aa2; --btn-text:#ffffff; --active:#2c6f84; --pill:#2b3236; --pill-text:#c8cdd0;
    --line:#2d3438; --card:#1e2427; --shadow:0 1px 3px rgba(0,0,0,.5);
    --info:#15303a; --info-line:#24505f; --stretch:#3a2f18; --stretch-text:#f0c069;
    --ai:#1b2c32; --disabled:#2e3438; --disabled-text:#7d868b; --field:#1e2427; --sel:#1f3a43;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161a1c; --side:#1d2225; --text:#e4e7e9; --muted:#a0a8ad; --title:#6cc2d8;
  --btn:#2c8aa2; --btn-text:#ffffff; --active:#2c6f84; --pill:#2b3236; --pill-text:#c8cdd0;
  --line:#2d3438; --card:#1e2427; --shadow:0 1px 3px rgba(0,0,0,.5);
  --info:#15303a; --info-line:#24505f; --stretch:#3a2f18; --stretch-text:#f0c069;
  --ai:#1b2c32; --disabled:#2e3438; --disabled-text:#7d868b; --field:#1e2427; --sel:#1f3a43;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--title);outline-offset:2px}
.shell{display:flex;min-height:100vh}
/* Sidebar */
.side{width:300px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:8px 0 24px;position:sticky;top:0;height:100vh;overflow:auto}
.side .burger{display:flex;justify-content:flex-end;padding:6px 24px 14px}
.nav a{display:flex;align-items:center;gap:16px;padding:12px 24px;color:var(--text);text-decoration:none;font-size:18px}
.nav a.sub{padding-left:56px;font-size:17px}
.nav a.active{background:var(--active);color:#fff}
.nav a .chev{margin-left:auto;opacity:.7}
.nav svg{width:26px;height:26px;flex:none}
.nav hr{border:0;border-top:1px solid var(--line);margin:14px 0}
/* Main */
main{flex:1;min-width:0;padding:22px 40px 120px}
.wrap{max-width:1180px}
h1{font-weight:400;font-size:40px;margin:0 0 4px 16px;letter-spacing:.2px}
.subtitle{font-weight:700;font-size:17px;margin:0 0 26px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:26px}
.tab{background:none;border:0;padding:10px 16px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
.tab.on{color:var(--title);border-bottom-color:var(--title);font-weight:500}
.tab .new{font-size:10.5px;font-weight:600;background:var(--title);color:var(--bg);border-radius:10px;padding:1px 7px}
.pill{display:inline-block;background:var(--pill);color:var(--pill-text);font-size:12px;border-radius:16px;padding:5px 12px;line-height:1.3}
.pill.stretch{background:var(--stretch);color:var(--stretch-text);font-weight:600}
.btn{background:var(--btn);color:var(--btn-text);border:0;border-radius:4px;padding:10px 16px;font-size:14.5px;font-weight:500}
.btn.ghost{background:transparent;color:var(--title);border:1px solid var(--title)}
.btn.small{padding:6px 12px;font-size:13px}
.linkbtn{background:none;border:0;color:var(--title);font-size:13.5px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--muted)}
/* Profile panel */
.profile{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;border:1px solid var(--line);border-radius:6px;padding:22px 24px;margin-bottom:30px;background:var(--card)}
.profile h2{font-size:22px;font-weight:400;margin:0 0 6px}
.profile p{margin:0 0 14px;color:var(--muted);max-width:60ch}
.arch{display:flex;gap:14px;align-items:flex-start;margin-top:4px}
.arch .badge{width:52px;height:52px;border-radius:50%;background:var(--sel);color:var(--title);display:grid;place-items:center;flex:none}
.arch .name{font-size:20px;font-weight:600;color:var(--title)}
.arch .core{font-size:13.5px;color:var(--muted)}
.signals h3{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.2px}
.sig{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.sig:first-of-type{border-top:0}
.sig b{font-weight:500}
.estimated{display:inline-block;font-size:11.5px;color:var(--muted);border:1px dashed var(--muted);border-radius:12px;padding:1px 8px;margin-left:6px;vertical-align:middle}
/* Section heading like program date rule */
.rule{display:flex;align-items:center;gap:14px;margin:8px 0 18px;color:var(--muted);font-weight:600;font-size:16.5px}
.rule::before,.rule::after{content:"";height:1px;background:var(--line);flex:1}
.rule::before{max-width:90px}
.why-note{font-size:13.5px;color:var(--muted);margin:-8px 0 18px;text-align:center}
/* Session cards */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px;margin-bottom:34px}
.card{background:var(--card);box-shadow:var(--shadow);border-radius:4px;padding:16px 16px 14px;display:flex;flex-direction:column;min-height:280px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.fav{background:none;border:0;color:var(--title);font-size:14px;display:flex;align-items:center;gap:6px;padding:2px}
.fav svg{width:16px;height:16px}
.card h4{margin:0 0 6px;color:var(--title);font-size:17px;font-weight:700;line-height:1.75}
.meta{font-size:14.5px;color:var(--muted);line-height:1.6}
.size{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-top:6px}
.size svg{width:15px;height:15px}
.reasons{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px dashed var(--line);font-size:13px}
.reasons li{display:flex;gap:7px;align-items:flex-start;margin-bottom:4px}
.reasons li svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--title)}
.card .foot{margin-top:auto;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.cartbtn{background:var(--disabled);color:var(--disabled-text);border:0;border-radius:3px;padding:7px 10px;font-size:14px}
.cartbtn.live{background:var(--btn);color:var(--btn-text)}
/* Assistant */
.assistant{border:1px solid var(--info-line);background:var(--ai);border-radius:6px;padding:22px 24px;margin-bottom:34px}
.assistant .head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.assistant .head .ic{width:44px;height:44px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;flex:none}
.assistant .head .ic svg{width:24px;height:24px}
.assistant .head h3{margin:0;font-size:19px;font-weight:600}
.assistant .head p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.assistant .head .btn{margin-left:auto}
.chat{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:640px;padding:12px 16px;border-radius:14px;font-size:14.5px}
.bubble.ai{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.bubble.me{background:var(--btn);color:var(--btn-text);border-top-right-radius:4px;align-self:flex-end}
.bubble .step{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;max-width:760px}
.choice{background:var(--field);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:8px 14px;font-size:14px;display:flex;align-items:center;gap:8px;text-align:left}
.choice .box{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:3px;flex:none;display:grid;place-items:center}
.choice.radio .box{border-radius:50%}
.choice[aria-pressed="true"]{border-color:var(--title);background:var(--sel);color:var(--title);font-weight:500}
.choice[aria-pressed="true"] .box{border-color:var(--title);background:var(--title)}
.choice[aria-pressed="true"] .box::after{content:"";width:6px;height:6px;background:var(--bg);border-radius:1px}
.choice.radio[aria-pressed="true"] .box::after{border-radius:50%}
.chat-actions{display:flex;gap:14px;align-items:center;margin-top:6px}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
/* Plan builder */
.plan{border-top:1px solid var(--line);padding-top:26px}
.plan-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.plan-head h2{font-size:28px;font-weight:400;margin:0}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:500}
.plan-actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 18px}
.info{display:flex;gap:10px;background:var(--info);border-radius:4px;padding:12px 16px;font-size:14px;margin-bottom:22px;max-width:820px}
.info svg{width:18px;height:18px;flex:none;color:var(--title);margin-top:2px}
.day{margin-bottom:24px}
.slot{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;margin-bottom:12px}
.slot .time{font-size:14px;color:var(--muted);padding-top:14px;text-align:right}
.slot .time b{display:block;color:var(--text);font-weight:500}
.pcard{background:var(--card);box-shadow:var(--shadow);border-radius:4px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;border-left:3px solid var(--title)}
.pcard.stretchy{border-left-color:var(--stretch-text)}
.pcard h4{margin:4px 0 2px;color:var(--title);font-size:16px;font-weight:700}
.pcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.pcard .side-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;justify-content:space-between}
.pcard .price{font-size:14px;white-space:nowrap}
.pcard .reason{font-size:13px;color:var(--muted);grid-column:1/-1}
.gap{margin-left:138px;font-size:13px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:8px 14px;margin-bottom:12px}
.flash{animation:fl 1.2s ease}
@keyframes fl{0%{background:var(--sel)}100%{background:var(--card)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
/* Mockup controls */
.mock{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border:1.5px dashed var(--muted);border-radius:8px;padding:10px 12px;font-size:12.5px;box-shadow:var(--shadow);z-index:20;max-width:calc(100vw - 32px)}
.mock .lbl{color:var(--muted);margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text);padding:6px 10px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-text)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.placeholder{padding:60px 0;text-align:center;color:var(--muted)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.profile{grid-template-columns:1fr}}
@media (max-width:860px){
  .side{display:none} main{padding:18px 16px 140px} h1{font-size:30px;margin-left:0}
  .grid{grid-template-columns:1fr}
  .slot{grid-template-columns:1fr;gap:4px}.slot .time{text-align:left;padding-top:0}
  .gap{margin-left:0}
  .pcard{grid-template-columns:1fr}.pcard .side-actions{flex-direction:row;align-items:center}
  .assistant .head .btn{margin-left:0}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="side" aria-label="Main navigation">
    <div class="burger"><svg width="44" height="30" viewBox="0 0 44 30" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 4h36M12 15h28M4 26h36"/></svg></div>
    <nav class="nav">
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg>My Profile</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 3v8l2-1.5L13 11V3"/></svg>My Records<span class="chev">⌄</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>Academy<span class="chev">⌄</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="1"/><path d="M12 8l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z"/></svg>VetSummit East 2026<span class="chev">⌄</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="1"/><path d="M12 8l1.2 2.4 2.6.4-1.9 1.8.5 2.6-2.4-1.3-2.4 1.3.5-2.6-1.9-1.8 2.6-.4z"/></svg>VetSummit West 2027<span class="chev">⌃</span></a>
      <a href="#" class="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/></svg>Registration</a>
      <a href="#" class="sub active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3v3H8z"/></svg>Program</a>
      <a href="#" class="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M7 8h2M11 8h6M7 12h2M11 12h6M7 16h2M11 16h6"/></svg>Exhibitors</a>
      <a href="#" class="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M8 17v-4M12 17V8M16 17v-6"/></svg>Conference Survey</a>
      <a href="#" class="sub"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M9 14l2 2 4-4"/></svg>Session Survey</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h3l3 12h11l2-8H6"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Cart</a>
      <hr>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4H4v16h10M10 12h11M17 8l4 4-4 4"/></svg>Sign Out</a>
    </nav>
  </aside>

  <main>
    <div class="wrap">
      <h1>Program for VetSummit West 2027</h1>
      <p class="subtitle">The education program is subject to change.</p>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="program">Program</button>
        <button class="tab" role="tab" data-tab="favorites">My Favorites</button>
        <button class="tab on" role="tab" data-tab="pathfinder" aria-selected="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
          Pathfinder <span class="new">New</span>
        </button>
      </div>
      <div id="view"></div>
    </div>
  </main>
</div>

<div class="mock" role="group" aria-label="Mockup controls">
  <div class="lbl">Mockup only: view as</div>
  <div class="seg">
    <button data-persona="returning" aria-pressed="true">Returning attendee</button>
    <button data-persona="first" aria-pressed="false">First-time attendee</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Icons ---------- */
const IC = {
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  starOn:'<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2 20c.8-3.5 3.6-5 7-5s6.2 1.5 7 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.4 2.2 4 5"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12l5 5 9-10"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 15l7-7 7 7"/></svg>',
  compass:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>'
};

/* ---------- Event data (sample) ---------- */
const DAYS = [
  {k:'sat', short:'Sat, Mar 13', long:'Saturday, Mar 13, 2027'},
  {k:'sun', short:'Sun, Mar 14', long:'Sunday, Mar 14, 2027'},
  {k:'mon', short:'Mon, Mar 15', long:'Monday, Mar 15, 2027'},
  {k:'tue', short:'Tue, Mar 16', long:'Tuesday, Mar 16, 2027'}
];
const LOC = {MB:'Lakeside Convention Center', OQ:'North Campus Learning Center', EC:'East Campus Skills Lab'};
const FMT = {lecture:'Lecture', case:'Case-based learning', discussion:'Interactive discussion', demo:'Demonstration', handson:'Hands-on lab', panel:'Panel discussion', sim:'Simulation'};
const FMT_TAG = {lecture:'Lecture', case:'Case-based', discussion:'Interactive', demo:'Demonstration', handson:'Hands-on Lab', panel:'Panel', sim:'Simulation'};
// [id, title, category, format, audience(V vet, T tech/student, P practice mgr, C CSR), day, start, end, loc, CE, price, capacity, registered, intent]

function questionsFor(p){
  const q = [];
  if(!p.returning) q.push({id:'exp', q:'How long have you worked in veterinary medicine?', opts:['Less than a year','1–3 years','4–10 years','More than 10 years'], max:1});
  q.push({id:'goal', q:'What do you most want to walk away with? Pick up to two.', opts:GOALS.map(g=>g.t), max:2});
  q.push({id:'fmt', q:'How do you like to learn? Pick any that fit.', opts:FORMAT_OPTS.map(f=>f[0]), max:7});
  q.push({id:'days', q:'Which days will you be at the event?', opts:DAYS.map(d=>d.short), max:4, preset:[0,1,2,3]});
  q.push({id:'budget', q:'Some labs are an extra purchase. Which should I include?', opts:['Included sessions only','Labs up to $600','Any lab'], max:1});
  q.push({id:'stretch', q:'How much should I push you outside your usual topics?', opts:['Keep me in my lane','Add one stretch session','Challenge me'], max:1, preset:[1]});
  return q;
}

/* ---------- Recommendation engine (stands in for the AI model) ---------- */
function context(){
  const p=P(), a=state.answers;
  const ctx={fmts:[], intents:[], goalCats:{}, goalOf:{}, days:DAYS.map(d=>d.k), budget:'default', stretch:1, exp:null};
  if(a.goal){a.goal.forEach(i=>{const g=GOALS[i]; ctx.intents.push(g.intent); ctx.goalOf[g.intent]=g.t; g.cats.forEach(c=>ctx.goalCats[c]=g.t)})}
  if(a.fmt) ctx.fmts=a.fmt.map(i=>FORMAT_OPTS[i][1]);
  if(a.days) ctx.days=a.days.map(i=>DAYS[i].k);
  if(a.budget) ctx.budget=['none','mid','any'][a.budget[0]];
  if(a.stretch) ctx.stretch=a.stretch[0];
  if(a.exp) ctx.exp=a.exp[0];
  return ctx;
}
function score(s, ctx){
  const p=P();
  if(!s.aud.includes(p.aud)) return null;
  if(!ctx.days.includes(s.day)) return null;
  if(s.price>0 && ctx.budget==='none') return null;
  if(s.price>0 && ctx.budget==='mid' && s.price>600) return null;
  let sc=0; const why=[];
  const cw=p.cat[s.cat]||0;
  if(cw){ sc+=cw*10; why.push([cw*10, p.returning ? `You’ve attended ${cw} ${s.cat} session${cw>1?'s':''}` : `A core topic for ${p.roleNoun}s like you`]); }
  const stretch = p.growthCats.includes(s.cat) && !cw;
  if(stretch){ sc+=4+ctx.stretch*12; why.push([40, `Stretch pick: builds ${p.growth} skills`]); }
  if(ctx.goalCats[s.cat]){ sc+=18; why.push([20, `Fits your goal: ${ctx.goalCats[s.cat].toLowerCase()}`]); }
  else if(ctx.intents.includes(s.intent)){ sc+=10; why.push([12, `Fits your goal: ${ctx.goalOf[s.intent].toLowerCase()}`]); }
  if(ctx.fmts.length){
    if(ctx.fmts.includes(s.fmt)){ sc+=14; why.push([14, `${FMT[s.fmt]}, a format you picked`]); } else sc-=8;
  } else if(p.fmtHist){
    sc+=(p.fmtHist[s.fmt]||0)*0.8;
    if(s.fmt==='handson'){ sc+=8; why.push([15,'Hands-on, a format you haven’t tried at VetSummit yet']); }
  } else if(s.fmt==='handson' || s.cap>=600){ sc+=4; }
  if(s.price>0 && ctx.budget==='default') sc-=3;
  if(ctx.exp===0 && (s.fmt==='lecture'||s.fmt==='demo')) sc+=5;
  if(ctx.exp!==null && ctx.exp>=2 && s.fmt==='handson') sc+=5;
  const left=s.cap-s.reg;
  if(s.cap<200 && left<=5) why.push([1, `Only ${left} spaces left`]);
  if(sc<10) return null;
  why.sort((x,y)=>y[0]-x[0]);
  return {s, sc, stretch, why:why.slice(0,2).map(w=>w[1])};
}
function scoredAll(ctx){ return SESS.map(s=>score(s,ctx)).filter(Boolean).sort((a,b)=>b.sc-a.sc); }
function clash(a,b){ if(a.day!==b.day) return false; const buf = a.loc!==b.loc?30:0; return a.start < b.end+buf && b.start < a.end+buf; }
function buildPlan(){
  const ctx=context(), all=scoredAll(ctx), picks=[];
  const fits = r=>picks.every(p=>!clash(p.s,r.s)) && picks.filter(p=>p.s.day===r.s.day).length<5;
  const nStretch=[0,1,2][ctx.stretch];
  all.filter(r=>r.stretch).forEach(r=>{ if(picks.filter(p=>p.stretch).length<nStretch && fits(r)) picks.push(r); });
  all.filter(r=>!r.stretch).forEach(r=>{ if(fits(r)) picks.push(r); });
  picks.sort((a,b)=>DAYS.findIndex(d=>d.k===a.s.day)-DAYS.findIndex(d=>d.k===b.s.day) || a.s.start-b.s.start);
  state.plan={picks, all, ctx};
}

  } else if(state.building){

function alternatives(r){

    document.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('on',t===b); t.setAttribute('aria-selected',t===b)});
    if(b.dataset.tab==='pathfinder') render();
    else view.innerHTML=`<div class="placeholder">The ${b.dataset.tab==='program'?'Program':'My Favorites'} tab is unchanged in this mockup.${b.dataset.tab==='favorites'&&state.favs.size?`<br>${state.favs.size} session${state.favs.size>1?'s':''} favorited from Pathfinder would appear here.`:''}</div>`;
    return;
  }
  if(b.dataset.fav){ const id=b.dataset.fav; state.favs.has(id)?state.favs.delete(id):state.favs.add(id); keepScroll(render); return; }
  if(b.dataset.cart){ toast(`Added “${byId[b.dataset.cart].title.slice(0,40)}…” to cart`); return; }
  if(b.dataset.choice!==undefined){
    const q=questionsFor(P())[state.step], i=+b.dataset.choice; let sel=state.pending||[];
    if(q.max===1) sel=[i];
    else if(sel.includes(i)) sel=sel.filter(x=>x!==i);
    else if(sel.length<q.max) sel=[...sel,i];
    else { toast(`Pick up to ${q.max}`); return; }
    state.pending=sel; refreshChat(); return;
  }
  if(b.dataset.swap){
    const r=state.plan.picks.find(p=>p.s.id===b.dataset.swap), alt=alternatives(r)[0]; if(!alt) return;
    state.swaps[alt.s.id]=[...(state.swaps[r.s.id]||[]), r.s.id];
    state.plan.picks[state.plan.picks.indexOf(r)]=alt;
    state.plan.picks.sort((a,c)=>DAYS.findIndex(d=>d.k===a.s.day)-DAYS.findIndex(d=>d.k===c.s.day)||a.s.start-c.s.start);
    keepScroll(renderPlan); const el=document.querySelector(`#slot-${alt.s.id} .pcard`); if(el) el.classList.add('flash'); return;
  }
  if(b.dataset.remove){ state.plan.picks=state.plan.picks.filter(p=>p.s.id!==b.dataset.remove); keepScroll(renderPlan); return; }
  const act=b.dataset.act;
  if(act==='start'){ state.step=0; state.chatLog=[{who:'ai',html:esc(P().returning
      ? `These picks lean on your history. Tell me a bit about this year and I’ll lay out a plan that fits your days.`
      : `Since this is your first VetSummit, I based these on your role. A few answers will make your plan much more personal.`)}];
    state.pending=questionsFor(P())[0].preset||[]; render(); document.getElementById('assistant').scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(act==='restart'){ const p=state.persona, f=state.favs; reset(p); state.favs=f; render(); return; }
  if(act==='next'||act==='skip'){
    const qs=questionsFor(P()), q=qs[state.step], sel=act==='skip'?[]:(state.pending||[]);
    state.chatLog.push({who:'ai',html:esc(q.q)});
    state.chatLog.push({who:'me',html:sel.length?esc(answerText(q,sel)):'Skip'});
    if(sel.length) state.answers[q.id]=sel; else delete state.answers[q.id];
    state.step++; state.pending=(qs[state.step]&&qs[state.step].preset)||[];
    if(state.step>=qs.length){
      state.building=true; refreshChat();
      setTimeout(()=>{
        state.building=false; buildPlan();
        const pk=state.plan.picks, ce=pk.reduce((t,r)=>t+r.s.ce,0), nd=new Set(pk.map(r=>r.s.day)).size;
        state.chatLog.push({who:'ai',html: pk.length
          ? `Here’s your plan: ${pk.length} sessions across ${nd} ${nd===1?'day':'days'} for ${ce} CE hours. I left travel time between the convention center and the campus labs and ${pk.some(r=>r.stretch)?'added a stretch session toward your growth path.':'kept you in familiar topics.'} Swap anything that doesn’t feel right.`
          : 'Nothing matched every answer. Try adding more days or formats.'});
        render(); document.getElementById('plan').scrollIntoView({behavior:'smooth',block:'start'});
      }, 900);
      return;
    }
    refreshChat(); return;
  }
  if(act==='favall'){ state.plan.picks.filter(r=>!r.s.price).forEach(r=>state.favs.add(r.s.id)); keepScroll(render); toast('Added to My Favorites'); return; }
  if(act==='cartall'){ toast('Labs added to cart'); return; }
  if(act==='assess'){ toast(P().estimated?'Opens the identity assessment':'Opens the archetype profile'); return; }
});
function refreshChat(){ document.getElementById('chat').innerHTML=chatHTML(); }
function renderPlan(){ document.getElementById('plan').innerHTML=planHTML(); }
function keepScroll(fn){ const y=window.scrollY; fn(); window.scrollTo(0,y); }
render();
</script>
</body>
</html>
