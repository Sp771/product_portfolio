<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="640" fill="#DCEEF4"/>
  <text x="800" y="70" text-anchor="middle" font-size="36" font-weight="700" fill="#7D2027">Where AI fits in the MemberPlex delivery cycle</text>
  <g font-size="26">
    <g transform="translate(60,130)">
      <rect width="330" height="400" rx="20" fill="#fff" stroke="#7D2027" stroke-width="4"/>
      <rect width="330" height="70" rx="20" fill="#7D2027"/><rect y="40" width="330" height="30" fill="#7D2027"/>
      <text x="165" y="47" text-anchor="middle" fill="#fff" font-weight="700" font-size="28">1. Backlog</text>
      <text x="30" y="125" fill="#673C34">AI-assisted ticket</text><text x="30" y="160" fill="#673C34">reviews</text>
      <text x="30" y="225" fill="#673C34">Flag requirement</text><text x="30" y="260" fill="#673C34">gaps</text>
      <text x="30" y="325" fill="#673C34">Sharper prioritization</text>
    </g>
    <g transform="translate(450,130)">
      <rect width="330" height="400" rx="20" fill="#fff" stroke="#7D2027" stroke-width="4"/>
      <rect width="330" height="70" rx="20" fill="#3E7F96"/><rect y="40" width="330" height="30" fill="#3E7F96"/>
      <text x="165" y="47" text-anchor="middle" fill="#fff" font-weight="700" font-size="28">2. Standups</text>
      <text x="30" y="125" fill="#673C34">Developer workload</text><text x="30" y="160" fill="#673C34">visibility</text>
      <text x="30" y="225" fill="#673C34">Daily update and</text><text x="30" y="260" fill="#673C34">priority tracking</text>
      <text x="30" y="325" fill="#673C34">Project progress</text>
    </g>
    <g transform="translate(840,130)">
      <rect width="330" height="400" rx="20" fill="#fff" stroke="#7D2027" stroke-width="4"/>
      <rect width="330" height="70" rx="20" fill="#CF5527"/><rect y="40" width="330" height="30" fill="#CF5527"/>
      <text x="165" y="47" text-anchor="middle" fill="#fff" font-weight="700" font-size="28">3. QA</text>
      <text x="30" y="125" fill="#673C34">AI-driven test</text><text x="30" y="160" fill="#673C34">preparation</text>
      <text x="30" y="225" fill="#673C34">Less repetitive</text><text x="30" y="260" fill="#673C34">manual testing</text>
      <text x="30" y="325" fill="#673C34">Faster turnaround</text>
    </g>
    <g transform="translate(1230,130)">
      <rect width="310" height="400" rx="20" fill="#fff" stroke="#7D2027" stroke-width="4"/>
      <rect width="310" height="70" rx="20" fill="#998731"/><rect y="40" width="310" height="30" fill="#998731"/>
      <text x="155" y="47" text-anchor="middle" fill="#fff" font-weight="700" font-size="28">4. Release</text>
      <text x="30" y="125" fill="#673C34">Consistent</text><text x="30" y="160" fill="#673C34">deployments</text>
      <text x="30" y="225" fill="#673C34">Release tracking</text>
      <text x="30" y="290" fill="#673C34">Clear production-</text><text x="30" y="325" fill="#673C34">readiness comms</text>
    </g>
  </g>
  <g fill="#7D2027"><path d="M398,330l40,0 -14,-14m14,14l-14,14" stroke="#7D2027" stroke-width="6" fill="none"/><path d="M788,330l40,0 -14,-14m14,14l-14,14" stroke="#7D2027" stroke-width="6" fill="none"/><path d="M1178,330l40,0 -14,-14m14,14l-14,14" stroke="#7D2027" stroke-width="6" fill="none"/></g>
  <text x="800" y="595" text-anchor="middle" font-size="24" fill="#7D2027" font-style="italic">Supported across the cycle by an Amazon Bedrock initiative for feedback summarization and RFP responses</text>
</svg>
